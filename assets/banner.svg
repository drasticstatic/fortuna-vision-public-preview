    <g class="arrive" style="animation-delay:0.77s"><path d="M789.2 126.7V169.7" stroke="#d9a441" stroke-width="1.5"/><rect x="779.8" y="145.8" width="18.7" height="16.2" rx="1" fill="#d9a441"/></g>
    <g class="arrive" style="animation-delay:0.94s"><path d="M820.4 124.9V183.4" stroke="#705c38" stroke-width="1.5"/><rect x="811.0" y="145.8" width="18.7" height="16.2" rx="1" fill="#101622" stroke="#705c38" stroke-width="1.5"/></g>
    <g class="arrive" style="animation-delay:1.12s"><path d="M851.6 122.0V184.4" stroke="#d9a441" stroke-width="1.5"/><rect x="842.2" y="141.1" width="18.7" height="20.9" rx="1" fill="#d9a441"/></g>
    <g class="arrive" style="animation-delay:1.29s"><path d="M882.8 111.9V160.7" stroke="#d9a441" stroke-width="1.5"/><rect x="873.4" y="126.4" width="18.7" height="14.7" rx="1" fill="#d9a441"/></g>
    <g class="arrive" style="animation-delay:1.46s"><path d="M914.0 83.0V143.5" stroke="#d9a441" stroke-width="1.5"/><rect x="904.6" y="100.3" width="18.7" height="26.2" rx="1" fill="#d9a441"/></g>
