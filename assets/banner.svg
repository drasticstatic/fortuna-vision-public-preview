<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">FortunaVision</title>
  <desc id="d">One market at a time, deeply. The picture: 15 candles arrive left to right with a line along their closes; the shapes are illustration, not data. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#0f3460"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#804c5a"/><stop offset="0.50" stop-color="#b87082"/><stop offset="1.00" stop-color="#ddb5bf"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#b87082" stop-opacity="0"/><stop offset=".35" stop-color="#b87082"/><stop offset="1" stop-color="#ddb5bf"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="962" cy="124" r="390"><stop offset="0" stop-color="#800020" stop-opacity=".8"/><stop offset=".6" stop-color="#5c1a2b" stop-opacity=".45"/><stop offset="1" stop-color="#5c1a2b" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <rect width="1200" height="260" fill="url(#ember)"/>
    <g class="arrive" style="animation-delay:0.25s"><path d="M695.6 173.2V196.4" stroke="#614154" stroke-width="1.5"/><rect x="686.2" y="182.4" width="18.7" height="13.1" rx="1" fill="#121424" stroke="#614154" stroke-width="1.5"/></g>
    <g class="arrive" style="animation-delay:0.42s"><path d="M726.8 188.2V204.2" stroke="#614154" stroke-width="1.5"/><rect x="717.4" y="195.4" width="18.7" height="2.1" rx="1" fill="#121424" stroke="#614154" stroke-width="1.5"/></g>
    <g class="arrive" style="animation-delay:0.60s"><path d="M758.0 159.3V212.0" stroke="#b87082" stroke-width="1.5"/><rect x="748.6" y="174.5" width="18.7" height="23.1" rx="1" fill="#b87082"/></g>
    <g class="arrive" style="animation-delay:0.77s"><path d="M789.2 154.7V186.8" stroke="#b87082" stroke-width="1.5"/><rect x="779.8" y="159.3" width="18.7" height="15.2" rx="1" fill="#b87082"/></g>
    <g class="arrive" style="animation-delay:0.94s"><path d="M820.4 147.3V185.3" stroke="#614154" stroke-width="1.5"/><rect x="811.0" y="159.3" width="18.7" height="12.3" rx="1" fill="#121424" stroke="#614154" stroke-width="1.5"/></g>
    <g class="arrive" style="animation-delay:1.12s"><path d="M851.6 154.4V177.1" stroke="#b87082" stroke-width="1.5"/><rect x="842.2" y="158.7" width="18.7" height="12.9" rx="1" fill="#b87082"/></g>
    <g class="arrive" style="animation-delay:1.29s"><path d="M882.8 142.7V163.1" stroke="#b87082" stroke-width="1.5"/><rect x="873.4" y="143.4" width="18.7" height="15.3" rx="1" fill="#b87082"/></g>
    <g class="arrive" style="animation-delay:1.46s"><path d="M914.0 132.0V157.7" stroke="#614154" stroke-width="1.5"/><rect x="904.6" y="143.4" width="18.7" height="2.7" rx="1" fill="#121424" stroke="#614154" stroke-width="1.5"/></g>
    <g class="arrive" style="animation-delay:1.64s"><path d="M945.2 130.0V167.8" stroke="#614154" stroke-width="1.5"/><rect x="935.8" y="146.1" width="18.7" height="9.1" rx="1" fill="#121424" stroke="#614154" stroke-width="1.5"/></g>
    <g class="arrive" style="animation-delay:1.81s"><path d="M976.4 129.5V170.6" stroke="#b87082" stroke-width="1.5"/><rect x="967.0" y="130.4" width="18.7" height="24.7" rx="1" fill="#b87082"/></g>
    <g class="arrive" style="animation-delay:1.98s"><path d="M1007.6 99.3V139.6" stroke="#b87082" stroke-width="1.5"/><rect x="998.2" y="118.2" width="18.7" height="12.2" rx="1" fill="#b87082"/></g>
    <g class="arrive" style="animation-delay:2.16s"><path d="M1038.8 80.6V133.0" stroke="#b87082" stroke-width="1.5"/><rect x="1029.4" y="99.1" width="18.7" height="19.1" rx="1" fill="#b87082"/></g>
    <g class="arrive" style="animation-delay:2.33s"><path d="M1070.0 67.0V103.9" stroke="#b87082" stroke-width="1.5"/><rect x="1060.6" y="84.6" width="18.7" height="14.5" rx="1" fill="#b87082"/></g>
    <g class="arrive" style="animation-delay:2.50s"><path d="M1101.2 41.4V106.3" stroke="#b87082" stroke-width="1.5"/><rect x="1091.8" y="57.3" width="18.7" height="27.3" rx="1" fill="#b87082"/></g>
    <g class="arrive" style="animation-delay:2.68s"><path d="M1132.4 38.0V61.2" stroke="#b87082" stroke-width="1.5"/><rect x="1123.0" y="46.3" width="18.7" height="11.1" rx="1" fill="#b87082"/></g>
    <path class="draw" pathLength="100" d="M695.6 195.4 L726.8 197.6 L758.0 174.5 L789.2 159.3 L820.4 171.6 L851.6 158.7 L882.8 143.4 L914.0 146.1 L945.2 155.2 L976.4 130.4 L1007.6 118.2 L1038.8 99.1 L1070.0 84.6 L1101.2 57.3 L1132.4 46.3" fill="none" stroke="#ddb5bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.80s"/>
    <circle class="halo" cx="1132.4" cy="46.3" r="9" fill="none" stroke="#ddb5bf" stroke-width="2"/>
    <circle cx="1132.4" cy="46.3" r="4.5" fill="#ddb5bf"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#1a1a2e"/><rect x="300.0" y="248" width="300.5" height="12" fill="#5c1a2b"/><rect x="600.0" y="248" width="300.5" height="12" fill="#800020"/><rect x="900.0" y="248" width="300.5" height="12" fill="#fbeef1"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="72.0" fill="#c78f9d" font-size="15" font-weight="700" letter-spacing=".6">drasticstatic lab · a chart-first workstation</text><text x="56" y="137.6" fill="#fbeef1" font-size="60" font-weight="700" letter-spacing="-.5">FortunaVision</text><text x="56" y="181.4" fill="#dcd0d6" font-size="23">One market at a time, deeply.</text></g>
  </g>
</svg>
