    <path class="draw" pathLength="100" d="M695.6 197.5 L726.8 169.0 L758.0 162.0 L789.2 145.8 L820.4 162.0 L851.6 141.1 L882.8 126.4 L914.0 100.3 L945.2 85.0 L976.4 75.3 L1007.6 77.2 L1038.8 65.4 L1070.0 75.4 L1101.2 56.9 L1132.4 69.1" fill="none" stroke="#e6d1a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.80s"/>
    <circle class="halo" cx="1132.4" cy="69.1" r="9" fill="none" stroke="#e6d1a6" stroke-width="2"/>
    <circle cx="1132.4" cy="69.1" r="4.5" fill="#e6d1a6"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#334155"/><rect x="300.0" y="248" width="300.5" height="12" fill="#8a6a2a"/><rect x="600.0" y="248" width="300.5" height="12" fill="#d9a441"/><rect x="900.0" y="248" width="300.5" height="12" fill="#f1f5f9"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="72.0" fill="#d9a441" font-size="15" font-weight="700" letter-spacing=".6">drasticstatic lab · a chart-first workstation</text><text x="56" y="137.6" fill="#f1f5f9" font-size="60" font-weight="700" letter-spacing="-.5">FortunaVision</text><text x="56" y="181.4" fill="#d3d7dd" font-size="23">One market at a time, deeply.</text></g>
  </g>
</svg>
