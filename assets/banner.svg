    <g class="arrive" style="animation-delay:1.81s"><path d="M976.4 62.5V89.3" stroke="#d9a441" stroke-width="1.5"/><rect x="967.0" y="75.3" width="18.7" height="9.7" rx="1" fill="#d9a441"/></g>
