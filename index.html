<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FortunaVision</title>
  <meta name="description" content="A chart-first market and treasury workstation: TradingView's open-source chart engine beside Fortuna's SVG engine, Auto Levels, regime, order flow, dealer gamma, drawings, indicator files, a command line, and a Treasury mode. Static, no keys.">
  <meta property="og:title" content="FortunaVision"><meta property="og:description" content="A chart-first market and treasury workstation. Two chart engines, Auto Levels, order flow, dealer gamma, drawings, a command line, a Treasury mode. Static, no keys."><meta property="og:type" content="website"><meta property="og:url" content="https://drasticstatic.github.io/fortuna-vision-public-preview/"><meta name="twitter:card" content="summary"><meta name="theme-color" content="#0b0f14">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23d9a441'/%3E%3Cpath d='M9 20l5-8 4 5 5-9' stroke='%230b0f14' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <div class="seg" id="mode" role="group" aria-label="mode"><button type="button" data-mode="markets" class="on" title="the trading workstation">Markets</button><button type="button" data-mode="treasury" title="the treasury workstation: chains, yields, stablecoins, holdings">Treasury</button></div>
    <a class="mark" href="./" title="FortunaVision"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#d9a441"/><path d="M9 20l5-8 4 5 5-9" stroke="#0b0f14" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>FortunaVision</a>
    <div class="title"><b id="mkt">—</b><span id="mkt-sub"></span></div>
    <div class="tfs" id="tfs" role="group" aria-label="timeframe"><button data-tf="5m">5m</button><button data-tf="15m">15m</button><button data-tf="1h" class="on">1h</button><button data-tf="4h">4h</button><button data-tf="1d">1d</button></div>
    <div class="seg" id="engine" role="group" aria-label="chart engine"><button type="button" data-eng="lw" class="on" title="TradingView's open-source Lightweight Charts renderer">TradingView</button><button type="button" data-eng="svg" title="Fortuna's own SVG renderer, the one its background analysis draws with">SVG</button></div>
    <div class="sp"></div>
    <span class="status" id="status"><i></i> loading</span>
    <span class="clock" id="clock"></span>
    <button class="ghost" id="help-btn" type="button" title="keys and commands (?)">?</button>
  </header>

  <main class="app">
    <aside class="rail" id="rail" aria-label="markets"></aside>

    <section class="work">
      <div class="tools" id="tools" role="toolbar" aria-label="drawing tools"></div>
      <div class="stage">
        <div class="legend" id="legend"></div>
        <div class="plot"><div id="chart"></div><svg id="csvg" hidden role="img" aria-label="price chart, SVG engine"></svg></div>
        <svg id="cpane" hidden role="img" aria-label="indicator pane, SVG engine"></svg>
        <div class="ohlc" id="ohlc"></div>
      </div>
    </section>

    <aside class="inspect">
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </aside>
  </main>

  <footer class="cmd">
    <span class="prompt" id="prompt">›</span>
    <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="type a market or a command: gold 15m · btc gex · es levels · draw fib · help" aria-label="command line">
    <span class="hint" id="cmd-hint">/ to focus · ↑↓ history · Esc clears</span>
  </footer>

  <div class="sheet" id="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><div class="sheet-h"><b id="sheet-title"></b><button class="ghost" id="sheet-x" type="button" aria-label="close">×</button></div><div id="sheet-body"></div></div></div>

  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="engines/autolevels.js"></script>
  <script src="engines/regime.js"></script>
  <script src="engines/calc.js"></script>
  <script type="module" src="js/app.js?v=20261027d"></script>
</body>
</html>
